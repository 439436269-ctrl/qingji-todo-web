<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#F6F7F9">
<title>轻记 · TODO</title>
<link rel="icon" href="data:,">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="轻记">
<style>
:root{
  --bg:#F6F7F9; --card:#FFFFFF; --ink:#1C1E21; --ink2:#8A9099; --line:#ECEEF1;
  --accent:#3D7BFA; --accent-soft:#EAF1FE;
  --high:#FA5151; --mid:#FF9F0A; --low:#34C759; --danger:#FA5151;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{
  background:#EDEFF3;color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif;
  font-size:16px;touch-action:manipulation;
}
button{font-family:inherit}
#app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--bg);display:flex;flex-direction:column;position:relative}
@media(min-width:520px){
  body{padding:24px 0}
  #app{min-height:calc(100vh - 48px);min-height:calc(100dvh - 48px);border-radius:24px;box-shadow:0 8px 40px rgba(0,0,0,.09);overflow:hidden}
}
header{padding:22px 20px 0;flex-shrink:0}
.head-row{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.brand{font-size:13px;color:var(--ink2);font-weight:500;letter-spacing:.4px}
.sync-chip{display:inline-flex;align-items:center;gap:6px;border:none;background:#fff;box-shadow:0 1px 2px rgba(16,24,40,.06);border-radius:999px;padding:6px 11px;font-size:12px;color:#6B7280;cursor:pointer;flex-shrink:0;margin-top:2px;font-family:inherit}
.sync-chip:active{transform:scale(.96)}
.sync-chip .dot{width:7px;height:7px;border-radius:50%;background:#C7CBD3}
.sync-chip.ok .dot{background:#34C759}
.sync-chip.pending .dot{background:var(--mid)}
.sync-chip.error .dot{background:var(--danger)}
.sync-chip.syncing .dot{background:var(--accent);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.3}}
h1{margin:2px 0 14px;font-size:26px;font-weight:700;letter-spacing:.2px}
.tabs{display:flex;background:#E9EBF0;border-radius:12px;padding:3px;gap:2px}
.tabs button{flex:1;height:34px;border:none;background:transparent;border-radius:9px;font-size:14px;color:#6B7280;font-weight:500;cursor:pointer;transition:.15s}
.tabs button.active{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(16,24,40,.08)}
.tagbar{padding:12px 0 0}
.tag-filter-chip{display:inline-flex;align-items:center;gap:7px;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px}
.tag-filter-chip button{border:none;background:rgba(61,123,250,.15);color:var(--accent);width:18px;height:18px;border-radius:50%;font-size:13px;line-height:1;cursor:pointer;padding:0}
main{flex:1;padding:12px 16px calc(120px + env(safe-area-inset-bottom))}
.group-header{display:flex;align-items:center;gap:8px;margin:18px 2px 8px}
.g-name{font-size:13px;font-weight:600;color:#6B7280}
.g-count{font-size:12px;color:#A9B0BA}
.g-more{margin-left:auto;width:28px;height:28px;border:none;background:transparent;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.g-more:active{background:#EEF0F4}
.done-label{font-size:12px;color:#A9B0BA;margin:14px 4px 8px}
.task{position:relative;display:flex;gap:12px;background:var(--card);border-radius:14px;padding:13px 14px 13px 16px;margin-bottom:8px;box-shadow:0 1px 2px rgba(16,24,40,.04);cursor:pointer;transition:transform .12s}
.task:active{transform:scale(.985)}
.task.anim{animation:tin .28s both}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
.pri-bar{position:absolute;left:0;top:12px;bottom:12px;width:4px;border-radius:0 3px 3px 0}
.check{width:23px;height:23px;border-radius:50%;border:2px solid #C7CBD3;background:transparent;flex:0 0 auto;margin-top:1px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;transition:background .2s,border-color .2s}
.check svg{width:12px;height:12px;stroke:#fff;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:22;stroke-dashoffset:22;transition:stroke-dashoffset .25s ease .05s}
.task.done .check{background:var(--accent);border-color:var(--accent);animation:pop .3s}
.task.done .check svg{stroke-dashoffset:0}
@keyframes pop{50%{transform:scale(1.15)}}
.t-body{flex:1;min-width:0}
.t-title{font-size:15.5px;font-weight:500;line-height:1.4;word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.task.done .t-title{color:#A9AFB9;text-decoration:line-through}
.task.done .t-meta{opacity:.65}
.t-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px;align-items:center}
.badge{display:inline-flex;align-items:center;padding:2.5px 9px;border-radius:999px;background:#F2F4F7;color:#6B7280;font-size:12px;line-height:1.5}
.badge.today{background:var(--accent-soft);color:var(--accent)}
.badge.overdue{background:#FEECEC;color:var(--danger)}
.tag-chip{display:inline-flex;align-items:center;border:none;cursor:pointer;padding:2.5px 9px;border-radius:999px;background:#F2F4F7;color:#6B7280;font-size:12px;line-height:1.5}
.tag-chip:active{background:#E7EAEF}
.empty{padding:70px 20px;text-align:center;color:#9AA1AB}
.empty svg{width:52px;height:52px;stroke:#C9CED6;fill:none;stroke-width:1.5}
.empty p{margin-top:12px;font-size:14px}
#fab{position:fixed;z-index:40;right:calc(50% - min(240px,50vw) + 18px);bottom:calc(22px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;border:none;background:var(--accent);color:#fff;box-shadow:0 8px 22px rgba(61,123,250,.45);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#fab:active{transform:scale(.92)}
#overlay{position:fixed;inset:0;background:rgba(15,20,30,0);transition:background .28s;display:flex;align-items:flex-end;justify-content:center;z-index:60}
#overlay.show{background:rgba(15,20,30,.45)}
#sheet{width:100%;max-width:480px;background:#fff;border-radius:20px 20px 0 0;padding:10px 20px calc(18px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .3s cubic-bezier(.32,.72,.3,1);max-height:88vh;overflow:auto;border:none}
#sheet.open{transform:none}
.handle{width:36px;height:4px;border-radius:99px;background:#E3E6EB;margin:2px auto 10px}
.sheet-title{font-size:13px;color:#98A0A9;text-align:center;margin:0 0 12px;font-weight:500}
.input{width:100%;border:1.5px solid transparent;background:#F4F5F7;border-radius:12px;padding:11px 13px;font-size:16px;color:var(--ink);outline:none;font-family:inherit}
.input:focus{border-color:var(--accent);background:#fff}
#f-title{margin-top:2px}
.f-label{font-size:12px;font-weight:600;color:#98A0A9;margin:16px 0 8px;letter-spacing:.3px}
.chip-row{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;background:#F2F4F7;border:1.5px solid transparent;color:#4B5563;font-size:13.5px;cursor:pointer}
.chip.sel{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);font-weight:600}
.chip i{width:8px;height:8px;border-radius:50%;display:inline-block}
.chip .x{border:none;background:transparent;color:inherit;font-size:15px;padding:0 0 0 2px;cursor:pointer;line-height:1}
.due-row{display:flex;gap:8px}
.due-row input[type=date]{flex:1}
.due-row input[type=time]{width:112px}
.quick-row{display:flex;gap:8px;margin-top:8px}
.quick{border:none;background:#F2F4F7;color:#6B7280;font-size:12.5px;padding:5px 11px;border-radius:999px;cursor:pointer}
.quick:active{background:#E7EAEF}
.sheet-foot{display:flex;gap:10px;margin-top:20px}
.sheet-foot button{border:none;border-radius:12px;font-size:15.5px;font-weight:600;cursor:pointer;transition:transform .12s}
.sheet-foot button:active{transform:scale(.97)}
#btn-del{flex:0 0 auto;padding:13px 18px;background:#FEECEC;color:var(--danger)}
#btn-save{flex:1;padding:13px;background:var(--accent);color:#fff}
#auth-overlay{position:fixed;inset:0;background:rgba(15,20,30,0);transition:background .25s;display:flex;align-items:center;justify-content:center;z-index:65;padding:20px}
#auth-overlay.show{background:rgba(15,20,30,.45)}
.auth-card{width:min(320px,100%);background:#fff;border-radius:18px;padding:20px;transform:scale(.96);transition:transform .2s}
#auth-overlay.show .auth-card{transform:scale(1)}
.auth-tabs{display:flex;gap:2px;background:#E9EBF0;border-radius:10px;padding:3px;margin-bottom:14px}
.auth-tabs button{flex:1;height:30px;border:none;background:transparent;border-radius:8px;font-size:13.5px;color:#6B7280;cursor:pointer;font-family:inherit}
.auth-tabs button.active{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(16,24,40,.08)}
.auth-card .input{margin-bottom:10px}
.auth-err{font-size:12.5px;color:var(--danger);min-height:17px;margin:2px 0 8px}
.auth-submit{width:100%;padding:12px;border:none;border-radius:12px;background:var(--accent);color:#fff;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
.auth-submit:active{transform:scale(.97)}
.auth-submit:disabled{opacity:.6}
#mini{position:fixed;inset:0;background:rgba(15,20,30,0);display:flex;align-items:center;justify-content:center;z-index:70;opacity:0;transition:opacity .2s;padding:20px}
#mini.show{opacity:1;background:rgba(15,20,30,.45)}
.mini-card{width:min(320px,100%);background:#fff;border-radius:18px;padding:20px;transform:scale(.96);transition:transform .2s}
#mini.show .mini-card{transform:scale(1)}
#mini-title{font-size:16px;font-weight:600;margin:0 0 12px}
#mini-msg{font-size:14px;color:#4B5563;line-height:1.5;margin:0 0 4px}
#mini-opts{display:flex;flex-direction:column;margin:4px -20px -8px}
.mini-opt{padding:13px 20px;text-align:left;border:none;background:none;font-size:15.5px;color:var(--ink);cursor:pointer;border-top:1px solid var(--line)}
.mini-opt.danger{color:var(--danger)}
.mini-actions{display:flex;gap:10px;margin-top:16px}
.mini-actions button{flex:1;padding:11px;border-radius:12px;border:none;font-size:15px;font-weight:600;cursor:pointer}
#btn-mini-cancel{background:#F2F4F7;color:#4B5563}
#btn-mini-ok{background:var(--accent);color:#fff}
#toast{position:fixed;left:50%;transform:translateX(-50%) translateY(8px);bottom:calc(96px + env(safe-area-inset-bottom));background:rgba(28,30,33,.92);color:#fff;padding:9px 16px;border-radius:999px;font-size:13.5px;opacity:0;transition:.25s;z-index:80;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="head-row">
      <div class="brand">轻记 · TODO</div>
      <button type="button" class="sync-chip auth" id="syncChip"><span class="dot"></span><span id="syncLabel">未登录</span></button>
    </div>
    <h1 id="dateLine">—</h1>
    <nav class="tabs" id="tabs">
      <button data-tab="all" class="active">全部</button>
      <button data-tab="today">今天</button>
      <button data-tab="done">已完成</button>
    </nav>
    <div class="tagbar" id="tagbar" hidden></div>
  </header>
  <main id="list"></main>
  <button id="fab" aria-label="添加任务"><svg viewBox="0 0 24 24" width="24" height="24"><path d="M12 5v14M5 12h14" stroke="#fff" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg></button>

  <div id="overlay" hidden>
    <form id="sheet" novalidate>
      <div class="handle"></div>
      <div class="sheet-title" id="sheetTitle">新任务</div>
      <input id="f-title" class="input" type="text" placeholder="想做什么？" maxlength="200" autocomplete="off">
      <div class="f-label">分组</div>
      <div class="chip-row" id="f-groups"></div>
      <div class="f-label">截止时间</div>
      <div class="due-row">
        <input id="f-date" class="input" type="date">
        <input id="f-time" class="input" type="time">
      </div>
      <div class="quick-row">
        <button type="button" class="quick" data-quick="today">今天</button>
        <button type="button" class="quick" data-quick="tomorrow">明天</button>
        <button type="button" class="quick" data-quick="clear">清除</button>
      </div>
      <div class="f-label">优先级</div>
      <div class="chip-row" id="f-prios"></div>
      <div class="f-label">标签</div>
      <div class="chip-row" id="f-tags-view"></div>
      <input id="f-tag-input" class="input" type="text" placeholder="输入标签后回车添加" autocomplete="off" style="margin-top:8px">
      <div class="sheet-foot">
        <button type="button" id="btn-del" style="display:none">删除</button>
        <button type="submit" id="btn-save">保存</button>
      </div>
    </form>
  </div>

  <div id="auth-overlay" hidden>
    <div class="auth-card">
      <div class="auth-tabs">
        <button type="button" data-mode="login" class="active">登录</button>
        <button type="button" data-mode="register">注册</button>
      </div>
      <input id="auth-user" class="input" type="text" placeholder="用户名（3-32位）" maxlength="32" autocomplete="username">
      <input id="auth-pass" class="input" type="password" placeholder="密码（至少6位）" maxlength="64" autocomplete="current-password">
      <div class="auth-err" id="auth-err"></div>
      <button type="button" class="auth-submit" id="auth-submit">登录</button>
    </div>
  </div>

  <div id="mini" hidden>
    <div class="mini-card">
      <div id="mini-title"></div>
      <p id="mini-msg" hidden></p>
      <div id="mini-opts" hidden></div>
      <div id="mini-form">
        <input id="mini-input" class="input" type="text" maxlength="30" autocomplete="off">
        <div class="mini-actions">
          <button type="button" id="btn-mini-cancel">取消</button>
          <button type="button" id="btn-mini-ok">确定</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" hidden></div>
</div>
<script>
'use strict';
const LS_KEY='qingji.todo.v1';
const $=s=>document.querySelector(s);
const PRIORITY={high:{label:'高',color:'#FA5151',w:3},mid:{label:'中',color:'#FF9F0A',w:2},low:{label:'低',color:'#34C759',w:1}};
let state,tab='all',tagFilter=null,firstRender=true,editId=null,miniResolve=null,toastTimer=null;
let sel={groupId:null,priority:null,tags:[]};

function uid(){return (crypto.randomUUID?crypto.randomUUID():'id-'+Date.now()+'-'+Math.random().toString(36).slice(2,8))}
function pad(n){return n<10?'0'+n:''+n}
function ds(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function today(){return ds(new Date())}
function addDays(n){const d=new Date();d.setDate(d.getDate()+n);return ds(d)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function newTask(o){return Object.assign({id:uid(),title:'',done:false,groupId:null,due:null,priority:null,tags:[],createdAt:Date.now(),completedAt:null},o||{})}
function groupsSorted(){return state.groups.slice().sort((a,b)=>a.order-b.order)}
function taskById(id){return state.tasks.find(t=>t.id===id)}
function groupOf(t){return state.groups.find(g=>g.id===t.groupId)}

function seed(){
  const groups=[{id:'g-work',name:'工作',order:0},{id:'g-life',name:'生活',order:1}];
  const mk=(title,groupId,d,time,priority,tags,done)=>newTask({title,groupId,due:d?{date:d,time:time||null}:null,priority,tags:tags||[],done:!!done,completedAt:done?Date.now()-36e5:null,createdAt:Date.now()-864e5});
  const tasks=[
    mk('整理产品需求文档','g-work',today(),'18:00','high',['产品']),
    mk('回复合作方邮件','g-work',addDays(1),'10:00','mid',['沟通']),
    mk('写本周周报','g-work',addDays(-1),null,'low',[]),
    mk('买菜：番茄、鸡蛋、牛奶','g-life',null,null,'low',['购物']),
    mk('预约周末羽毛球场地','g-life',today(),'21:00','mid',['运动']),
    mk('给妈妈打电话','g-life',null,null,null,['家人'],true)
  ];
  return {groups,tasks,seedClean:true};
}
function load(){
  try{const raw=localStorage.getItem(LS_KEY);
    if(raw){const s=JSON.parse(raw);if(s&&Array.isArray(s.groups)&&s.groups.length&&Array.isArray(s.tasks))return s}
  }catch(e){}
  return seed();
}
function save(){try{state.seedClean=false;localStorage.setItem(LS_KEY,JSON.stringify(state))}catch(e){}}

function fmtDateLine(){const d=new Date();return (d.getMonth()+1)+'月'+d.getDate()+'日 星期'+'日一二三四五六'[d.getDay()]}
function dueInfo(t){
  if(!t.due||!t.due.date)return null;
  const td=today();let lab,cls='';
  if(t.due.date===td){lab='今天';cls='today'}
  else if(t.due.date===addDays(1))lab='明天';
  else if(t.due.date===addDays(-1)){lab='昨天';cls='overdue'}
  else{const p=t.due.date.split('-');lab=(+p[1])+'月'+(+p[2])+'日';if(t.due.date<td&&!t.done)cls='overdue'}
  if(t.due.time)lab+=' '+t.due.time;
  return {label:lab,cls};
}
function sortUndone(arr){
  const key=t=>((t.due&&t.due.date)?t.due.date:'9999-99-99')+' '+((t.due&&t.due.time)?t.due.time:'99:99');
  const w=t=>t.priority?PRIORITY[t.priority].w:0;
  return arr.sort((a,b)=>{
    const ka=key(a),kb=key(b);
    if(ka!==kb)return ka<kb?-1:1;
    if(w(a)!==w(b))return w(b)-w(a);
    return a.createdAt-b.createdAt;
  });
}
function buildSections(undone,doneExtra){
  const secs=[];
  const placed=new Set();
  for(const g of groupsSorted()){
    const items=undone.filter(t=>t.groupId===g.id);
    const dn=doneExtra.filter(t=>t.groupId===g.id);
    items.concat(dn).forEach(t=>placed.add(t.id));
    if(items.length||dn.length)secs.push({group:g,items,done:dn});
  }
  const orph=undone.filter(t=>!placed.has(t.id));
  const orphDone=doneExtra.filter(t=>!placed.has(t.id));
  if(orph.length||orphDone.length)secs.push({group:{id:null,name:'未分组'},items:orph,done:orphDone});
  return secs;
}
function visibleFor(tb){
  const td=today();
  const byTag=t=>!tagFilter||t.tags.includes(tagFilter);
  if(tb==='done'){
    return {flat:state.tasks.filter(t=>t.done).sort((a,b)=>(b.completedAt||0)-(a.completedAt||0))};
  }
  let undone=state.tasks.filter(t=>!t.done&&byTag(t));
  if(tb==='today')undone=undone.filter(t=>t.due&&t.due.date&&t.due.date<=td);
  sortUndone(undone);
  let doneExtra=[];
  if(tb==='all')doneExtra=state.tasks.filter(t=>t.done&&byTag(t));
  if(tb==='today')doneExtra=state.tasks.filter(t=>t.done&&t.completedAt&&ds(new Date(t.completedAt))===td&&byTag(t));
  return {sections:buildSections(undone,doneExtra)};
}
function taskHtml(t){
  const bar=t.priority?'<span class="pri-bar" style="background:'+PRIORITY[t.priority].color+'"></span>':'';
  const due=dueInfo(t);
  const dueHtml=due?'<span class="badge '+due.cls+'">'+esc(due.label)+'</span>':'';
  const tagsHtml=t.tags.map(x=>'<button type="button" class="tag-chip" data-tag="'+esc(x)+'">'+esc(x)+'</button>').join('');
  const gid=(tab==='done'&&groupOf(t))?'<span class="badge">'+esc(groupOf(t).name)+'</span>':'';
  const meta=(gid||dueHtml||tagsHtml)?('<div class="t-meta">'+gid+dueHtml+tagsHtml+'</div>'):'';
  return '<div class="task '+(t.done?'done ':'')+(firstRender?'anim':'')+'" data-id="'+t.id+'">'+bar+
    '<button type="button" class="check" aria-label="标记完成"><svg viewBox="0 0 14 14"><path d="M2.5 7.5 L5.8 10.5 L11.5 3.5"/></svg></button>'+
    '<div class="t-body"><div class="t-title">'+esc(t.title)+'</div>'+meta+'</div></div>';
}
function emptyHtml(){
  const msg=tagFilter?('没有带「'+esc(tagFilter)+'」标签的任务'):
    (tab==='today'?'今天没有安排，享受当下吧':tab==='done'?'还没有完成的任务':'还没有任务，点右下角 + 开始');
  return '<div class="empty"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="M8 12.5 L11 15.5 L16.5 9.5"/></svg><p>'+msg+'</p></div>';
}
function render(){
  $('#dateLine').textContent=fmtDateLine();
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
  const bar=$('#tagbar');
  if(tagFilter){bar.hidden=false;bar.innerHTML='<span class="tag-filter-chip">标签 · '+esc(tagFilter)+'<button type="button" id="clearTag" aria-label="清除标签筛选">×</button></span>'}
  else bar.hidden=true;
  const list=$('#list');
  const v=visibleFor(tab);
  if(tab==='done'){
    list.innerHTML=v.flat.length?v.flat.map(taskHtml).join(''):emptyHtml();
  }else if(!v.sections.length){
    list.innerHTML=emptyHtml();
  }else{
    list.innerHTML=v.sections.map(sec=>{
      let h='<div class="group-header"><span class="g-name">'+esc(sec.group.name)+'</span><span class="g-count">'+sec.items.length+'</span>'+
        (sec.group.id?'<button type="button" class="g-more" data-gid="'+sec.group.id+'" aria-label="分组操作"><svg viewBox="0 0 16 16" width="16" height="16"><circle cx="3" cy="8" r="1.6" fill="#B3B9C2"/><circle cx="8" cy="8" r="1.6" fill="#B3B9C2"/><circle cx="13" cy="8" r="1.6" fill="#B3B9C2"/></svg></button>':'')+'</div>';
      h+=sec.items.map(taskHtml).join('');
      if(sec.done.length)h+='<div class="done-label">已完成 · '+sec.done.length+'</div>'+sec.done.map(taskHtml).join('');
      return h;
    }).join('');
  }
  firstRender=false;
}
function toast(msg){
  const t=$('#toast');t.textContent=msg;t.hidden=false;t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.hidden=true,250)},1800);
}

/* ---- 编辑面板（底部弹出） ---- */
function openSheet(id){
  editId=id||null;
  const t=editId?taskById(editId):null;
  sel={groupId:t?t.groupId:((groupsSorted()[0]||{}).id||null),priority:t?t.priority:null,tags:t?t.tags.slice():[]};
  $('#sheetTitle').textContent=t?'编辑任务':'新任务';
  $('#f-title').value=t?t.title:'';
  $('#f-date').value=(t&&t.due)?t.due.date:'';
  $('#f-time').value=(t&&t.due&&t.due.time)?t.due.time:'';
  $('#btn-del').style.display=t?'':'none';
  renderSheetChips();renderTagChips();
  const ov=$('#overlay');ov.hidden=false;
  requestAnimationFrame(()=>{ov.classList.add('show');$('#sheet').classList.add('open')});
  if(!t)setTimeout(()=>$('#f-title').focus(),320);
}
function closeSheet(){
  const ov=$('#overlay');ov.classList.remove('show');$('#sheet').classList.remove('open');
  setTimeout(()=>{ov.hidden=true},280);
  $('#f-title').blur();
}
function renderSheetChips(){
  $('#f-groups').innerHTML=groupsSorted().map(g=>'<button type="button" class="chip '+(g.id===sel.groupId?'sel':'')+'" data-gid="'+g.id+'">'+esc(g.name)+'</button>').join('')+
    '<button type="button" class="chip" id="f-addgroup">＋ 新建</button>';
  $('#f-prios').innerHTML=['null','low','mid','high'].map(p=>{
    const lbl=p==='null'?'无':PRIORITY[p].label;
    const dot=p!=='null'?'<i style="background:'+PRIORITY[p].color+'"></i>':'';
    return '<button type="button" class="chip '+((sel.priority||'null')===p?'sel':'')+'" data-prio="'+p+'">'+dot+lbl+'</button>';
  }).join('');
}
function renderTagChips(){
  $('#f-tags-view').innerHTML=sel.tags.map((x,i)=>'<span class="chip sel">'+esc(x)+'<button type="button" class="x" data-i="'+i+'" aria-label="移除标签">×</button></span>').join('');
}
function saveSheet(){
  const title=$('#f-title').value.trim();
  if(!title){toast('先写点内容吧');$('#f-title').focus();return}
  const date=$('#f-date').value||null,time=$('#f-time').value||null;
  const due=date?{date,time}:null;
  if(editId){
    const t=taskById(editId);
    Object.assign(t,{title,due,groupId:sel.groupId,priority:sel.priority,tags:sel.tags.slice()});
    touch(t);save();closeSheet();render();markDirty('task',t.id);
  }else{
    const nt=newTask({title,due,groupId:sel.groupId,priority:sel.priority,tags:sel.tags.slice()});
    touch(nt);state.tasks.push(nt);save();closeSheet();render();markDirty('task',nt.id);
  }
}

/* ---- 轻量弹窗（输入 / 确认 / 菜单） ---- */
function miniReset(){$('#mini-msg').hidden=true;$('#mini-opts').hidden=true;$('#mini-form').style.display=''}
function miniPrompt(title,value){
  const m=$('#mini');miniReset();
  $('#mini-title').textContent=title;$('#mini-input').value=value||'';
  m.hidden=false;requestAnimationFrame(()=>m.classList.add('show'));
  setTimeout(()=>$('#mini-input').focus(),90);
  return new Promise(r=>miniResolve=r);
}
function miniConfirm(msg){
  const m=$('#mini');miniReset();
  $('#mini-title').textContent='确认操作';$('#mini-msg').textContent=msg;$('#mini-msg').hidden=false;
  $('#mini-input').value='';
  m.hidden=false;requestAnimationFrame(()=>m.classList.add('show'));
  return new Promise(r=>miniResolve=r);
}
function miniMenu(title,opts){
  const m=$('#mini');miniReset();
  $('#mini-title').textContent=title;$('#mini-form').style.display='none';
  $('#mini-opts').hidden=false;
  $('#mini-opts').innerHTML=opts.map(o=>'<button type="button" class="mini-opt '+(o.danger?'danger':'')+'" data-k="'+o.key+'">'+esc(o.label)+'</button>').join('');
  m.hidden=false;requestAnimationFrame(()=>m.classList.add('show'));
  return new Promise(r=>miniResolve=r);
}
function closeMini(val){
  const m=$('#mini');m.classList.remove('show');
  setTimeout(()=>{m.hidden=true},200);
  if(miniResolve){miniResolve(val);miniResolve=null}
}
async function groupMenu(gid){
  const g=state.groups.find(x=>x.id===gid);
  const k=await miniMenu(g.name,[{key:'rename',label:'重命名分组'},{key:'delete',label:'删除分组',danger:true}]);
  if(k==='rename'){
    const name=await miniPrompt('重命名分组',g.name);
    if(name&&name.trim()){g.name=name.trim();touch(g);save();render();markDirty('group',g.id)}
  }else if(k==='delete'){
    if(state.groups.length<=1){toast('至少保留一个分组');return}
    const target=groupsSorted().find(x=>x.id!==g.id);
    if(await miniConfirm('删除分组「'+g.name+'」？其中的任务将移动到「'+target.name+'」')){
      const moved=state.tasks.filter(t=>t.groupId===g.id);
      moved.forEach(t=>{t.groupId=target.id;touch(t)});
      if(sel.groupId===g.id)sel.groupId=target.id;
      state.groups=state.groups.filter(x=>x.id!==g.id);
      save();render();toast('分组已删除');
      markDirty('group',g.id);
      moved.forEach(t=>markDirty('task',t.id));
    }
  }
}
/* ---- 云同步（登录 / outbox / 推拉） ---- */
const AUTH_KEY='qingji.auth.v1';
const API_BASE=(()=>{const v=localStorage.getItem('qingji.api_base');if(v)return v.replace(/\/+$/,'');return (location.protocol==='http:'||location.protocol==='https:')?'':'http://127.0.0.1:8787';})();
const SYNC={token:null,user:null,cursor:0,offset:0,outbox:[],inFlight:false,timer:null,authMode:'login'};

function loadAuth(){
  try{const raw=localStorage.getItem(AUTH_KEY);if(!raw)return;const a=JSON.parse(raw);
    SYNC.token=a.token||null;SYNC.user=a.user||null;SYNC.cursor=a.cursor||0;SYNC.offset=a.offset||0;SYNC.outbox=Array.isArray(a.outbox)?a.outbox:[];
  }catch(e){}
}
function saveAuth(){
  try{localStorage.setItem(AUTH_KEY,JSON.stringify({token:SYNC.token,user:SYNC.user,cursor:SYNC.cursor,offset:SYNC.offset,outbox:SYNC.outbox}))}catch(e){}
}
const nowMs=()=>Date.now()+SYNC.offset;
function touch(t){t.updatedAt=nowMs()}
function findEntity(type,id){return type==='task'?state.tasks.find(t=>t.id===id):state.groups.find(g=>g.id===id)}
function removeEntity(type,id){if(type==='task')state.tasks=state.tasks.filter(t=>t.id!==id);else state.groups=state.groups.filter(g=>g.id!==id)}

// 变更登记：只存实体引用，发送时取最新快照（多次修改自动合并为一次）；实体已不存在即删除墓碑
function markDirty(type,id){
  if(!SYNC.token)return;
  if(!SYNC.outbox.some(c=>c.entityType===type&&c.id===id))SYNC.outbox.push({entityType:type,id});
  saveAuth();refreshSyncChip();scheduleSync(2000);
}
function snapshot(c){
  const d=findEntity(c.entityType,c.id);
  if(!d)return{id:c.id,deleted:true,updatedAt:nowMs()};
  return Object.assign({},d,{deleted:false,updatedAt:d.updatedAt||nowMs()});
}

async function api(method,path,body){
  const headers={'Content-Type':'application/json'};
  if(SYNC.token)headers.Authorization='Bearer '+SYNC.token;
  const res=await fetch(API_BASE+path,{method,headers,body:body?JSON.stringify(body):undefined});
  let d=null;try{d=await res.json()}catch(e){}
  if(!res.ok){const e=new Error((d&&d.error)||('HTTP '+res.status));e.status=res.status;throw e}
  if(d&&typeof d.serverTime==='number')SYNC.offset=d.serverTime-Date.now();
  return d;
}

// 拉取应用守卫：仅接受 updatedAt 严格更新的版本；墓碑则移除本地
function applyChanges(changes){
  let changed=false;
  for(const ch of changes){
    const d=ch.data;
    if(!d||typeof d!=='object')continue;
    const local=findEntity(ch.entityType,d.id);
    if(local){
      if((d.updatedAt||0)>(local.updatedAt||0)){
        removeEntity(ch.entityType,d.id);
        if(!d.deleted)(ch.entityType==='task'?state.tasks:state.groups).push(Object.assign({},d));
        changed=true;
      }
    }else if(!d.deleted){
      (ch.entityType==='task'?state.tasks:state.groups).push(Object.assign({},d));
      changed=true;
    }
  }
  return changed;
}

function refreshSyncChip(){
  const chip=$('#syncChip');
  let cls='auth',txt='未登录';
  if(SYNC.token){
    cls='ok';txt=SYNC.user?SYNC.user.username:'已同步';
    if(SYNC.outbox.length){cls='pending';txt='待同步'}
  }
  chip.className='sync-chip '+cls;
  $('#syncLabel').textContent=txt;
}
function setChip(cls,txt){const chip=$('#syncChip');chip.className='sync-chip '+cls;$('#syncLabel').textContent=txt}

async function doSync(){
  if(!SYNC.token||SYNC.inFlight)return;
  SYNC.inFlight=true;setChip('syncing','同步中');
  try{
    if(SYNC.outbox.length){
      const changes=SYNC.outbox.map(c=>({entityType:c.entityType,data:snapshot(c)}));
      await api('POST','/v1/sync',{changes});
      SYNC.outbox=[];saveAuth();
    }
    for(;;){
      const r=await api('GET','/v1/sync?cursor='+SYNC.cursor);
      const list=r.changes||[];
      if(list.length){
        if(applyChanges(list)){save();render()}
        SYNC.cursor=r.cursor;saveAuth();
      }
      if(list.length<200)break;
    }
    refreshSyncChip();
  }catch(e){
    setChip('error','同步失败');
    if(e.status===401)logout();
  }
  SYNC.inFlight=false;
}
function scheduleSync(ms){clearTimeout(SYNC.timer);SYNC.timer=setTimeout(doSync,ms)}
function logout(){
  SYNC.token=null;SYNC.user=null;SYNC.cursor=0;SYNC.offset=0;SYNC.outbox=[];
  saveAuth();refreshSyncChip();toast('已退出登录');
}

function openAuth(mode){
  SYNC.authMode=mode;
  document.querySelectorAll('.auth-tabs button').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));
  $('#auth-err').textContent='';
  $('#auth-submit').textContent=mode==='login'?'登录':'注册';
  const ov=$('#auth-overlay');ov.hidden=false;
  requestAnimationFrame(()=>ov.classList.add('show'));
  setTimeout(()=>$('#auth-user').focus(),80);
}
function closeAuth(){
  const ov=$('#auth-overlay');ov.classList.remove('show');
  setTimeout(()=>{ov.hidden=true},250);
  $('#auth-pass').blur();
}
async function submitAuth(){
  const u=$('#auth-user').value.trim(),p=$('#auth-pass').value;
  const err=$('#auth-err');err.textContent='';
  if(!u||!p){err.textContent='请输入用户名和密码';return}
  const btn=$('#auth-submit');btn.disabled=true;btn.textContent=SYNC.authMode==='login'?'登录中…':'注册中…';
  try{
    const path=SYNC.authMode==='login'?'/v1/auth/login':'/v1/auth/register';
    const r=await api('POST',path,{username:u,password:p});
    SYNC.token=r.token;SYNC.user=r.user;SYNC.cursor=0;SYNC.offset=r.serverTime-Date.now();SYNC.outbox=[];
    if(state.seedClean){
      // 从未动过的演示数据不上传：清空本地，直接拉取云端（新账号则得到干净空列表）
      state={groups:[],tasks:[],seedClean:false};save();render();
    }else{
      for(const g of state.groups)SYNC.outbox.push({entityType:'group',id:g.id});
      for(const t of state.tasks)SYNC.outbox.push({entityType:'task',id:t.id});
    }
    saveAuth();closeAuth();refreshSyncChip();toast('登录成功，正在同步…');
    doSync();
  }catch(e){err.textContent=e.message||'操作失败'}
  btn.disabled=false;btn.textContent=SYNC.authMode==='login'?'登录':'注册';
}

/* ---- 事件 ---- */
$('#fab').addEventListener('click',()=>openSheet());
$('#tabs').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  tab=b.dataset.tab;render();window.scrollTo(0,0);
});
$('#tagbar').addEventListener('click',e=>{
  if(e.target.id==='clearTag'){tagFilter=null;render()}
});
$('#list').addEventListener('click',e=>{
  const more=e.target.closest('.g-more');
  if(more){groupMenu(more.dataset.gid);return}
  const chk=e.target.closest('.check');
  if(chk){
    const t=taskById(chk.closest('.task').dataset.id);
    t.done=!t.done;t.completedAt=t.done?Date.now():null;
    touch(t);save();render();markDirty('task',t.id);return;
  }
  const tc=e.target.closest('.tag-chip');
  if(tc){tagFilter=tc.dataset.tag;render();window.scrollTo(0,0);return}
  const task=e.target.closest('.task');
  if(task)openSheet(task.dataset.id);
});
$('#overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeSheet()});
$('#f-groups').addEventListener('click',async e=>{
  const add=e.target.closest('#f-addgroup');
  if(add){
    const name=await miniPrompt('新建分组','');
    if(name&&name.trim()){
      const g={id:uid(),name:name.trim(),order:Math.max(-1,...state.groups.map(x=>x.order))+1,createdAt:Date.now()};
      state.groups.push(g);touch(g);save();sel.groupId=g.id;renderSheetChips();markDirty('group',g.id);
    }
    return;
  }
  const c=e.target.closest('.chip');
  if(c){sel.groupId=c.dataset.gid;renderSheetChips()}
});
$('#f-prios').addEventListener('click',e=>{
  const c=e.target.closest('.chip');if(!c)return;
  sel.priority=c.dataset.prio==='null'?null:c.dataset.prio;
  renderSheetChips();
});
$('#f-tags-view').addEventListener('click',e=>{
  const x=e.target.closest('.x');
  if(x){sel.tags.splice(+x.dataset.i,1);renderTagChips()}
});
$('#f-tag-input').addEventListener('keydown',e=>{
  if(e.key==='Enter'||e.key===','){
    e.preventDefault();
    const v=e.target.value.trim();
    if(v&&!sel.tags.some(x=>x.toLowerCase()===v.toLowerCase())){sel.tags.push(v);renderTagChips()}
    e.target.value='';
  }
});
document.querySelectorAll('.quick').forEach(b=>b.addEventListener('click',()=>{
  const k=b.dataset.quick;
  $('#f-date').value=k==='clear'?'':(k==='today'?today():addDays(1));
  if(k==='clear')$('#f-time').value='';
}));
$('#sheet').addEventListener('submit',e=>{e.preventDefault();saveSheet()});
$('#btn-del').addEventListener('click',async()=>{
  const t=taskById(editId);if(!t)return;
  if(await miniConfirm('删除任务「'+t.title+'」？')){
    state.tasks=state.tasks.filter(x=>x.id!==editId);
    save();closeSheet();render();toast('已删除');
    markDirty('task',editId);
  }
});
$('#mini-opts').addEventListener('click',e=>{
  const b=e.target.closest('.mini-opt');
  if(b)closeMini(b.dataset.k);
});
$('#btn-mini-cancel').addEventListener('click',()=>closeMini(null));
$('#btn-mini-ok').addEventListener('click',()=>closeMini($('#mini-input').hidden?true:$('#mini-input').value));
$('#mini').addEventListener('click',e=>{if(e.target.id==='mini')closeMini(null)});
$('#mini-input').addEventListener('keydown',e=>{
  if(e.key==='Enter'){e.preventDefault();closeMini($('#mini-input').value)}
});
$('#syncChip').addEventListener('click',()=>{
  if(!SYNC.token){openAuth('login');return}
  if(SYNC.outbox.length){doSync();return}
  miniConfirm('退出登录 '+(SYNC.user?SYNC.user.username:'')+'？本地数据会保留。').then(yes=>{if(yes)logout()});
});
$('#auth-overlay').addEventListener('click',e=>{if(e.target.id==='auth-overlay')closeAuth()});
document.querySelectorAll('.auth-tabs button').forEach(b=>b.addEventListener('click',()=>{
  SYNC.authMode=b.dataset.mode;
  document.querySelectorAll('.auth-tabs button').forEach(x=>x.classList.toggle('active',x===b));
  $('#auth-err').textContent='';
  $('#auth-submit').textContent=SYNC.authMode==='login'?'登录':'注册';
}));
$('#auth-submit').addEventListener('click',submitAuth);
$('#auth-pass').addEventListener('keydown',e=>{if(e.key==='Enter')submitAuth()});
$('#auth-user').addEventListener('keydown',e=>{if(e.key==='Enter')$('#auth-pass').focus()});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(!$('#auth-overlay').hidden)closeAuth();
    else if(!$('#mini').hidden)closeMini(null);
    else if(!$('#overlay').hidden)closeSheet();
  }
});

state=load();
loadAuth();
render();
refreshSyncChip();
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&SYNC.token)scheduleSync(1000)});
setInterval(()=>{if(SYNC.token)doSync()},300000);
// HTTP(S) 环境注册离线缓存（file:// 的 Android 壳内不注册）
if((location.protocol==='https:'||location.protocol==='http:')&&'serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
