<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#F6F7F9">
<title>轻记 · TODO</title>
<link rel="icon" href="data:,">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="轻记">
<style>
:root{
  --bg:#F6F7F9; --card:#FFFFFF; --ink:#1C1E21; --ink2:#8A9099; --line:#ECEEF1;
  --accent:#3D7BFA; --accent-soft:#EAF1FE;
  --high:#FA5151; --mid:#FF9F0A; --low:#34C759; --danger:#FA5151;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{
  background:#EDEFF3;color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif;
  font-size:16px;touch-action:manipulation;
}
button{font-family:inherit}
#app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--bg);display:flex;flex-direction:column;position:relative}
@media(min-width:520px){
  body{padding:24px 0}
  #app{min-height:calc(100vh - 48px);min-height:calc(100dvh - 48px);border-radius:24px;box-shadow:0 8px 40px rgba(0,0,0,.09);overflow:hidden}
}
header{padding:22px 20px 0;flex-shrink:0}
.head-row{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.head-actions{display:flex;align-items:center;gap:6px}
#menuChip{padding:6px 9px;margin-top:2px;color:#6B7280}
#menuChip svg{display:block}
.brand{font-size:13px;color:var(--ink2);font-weight:500;letter-spacing:.4px}
.sync-chip{display:inline-flex;align-items:center;gap:6px;border:none;background:#fff;box-shadow:0 1px 2px rgba(16,24,40,.06);border-radius:999px;padding:6px 11px;font-size:12px;color:#6B7280;cursor:pointer;flex-shrink:0;margin-top:2px;font-family:inherit}
.sync-chip:active{transform:scale(.96)}
.sync-chip .dot{width:7px;height:7px;border-radius:50%;background:#C7CBD3}
.sync-chip.ok .dot{background:#34C759}
.sync-chip.pending .dot{background:var(--mid)}
.sync-chip.error .dot{background:var(--danger)}
.sync-chip.syncing .dot{background:var(--accent);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.3}}
h1{margin:2px 0 14px;font-size:26px;font-weight:700;letter-spacing:.2px}
.tabs{display:flex;background:#E9EBF0;border-radius:12px;padding:3px;gap:2px}
.tabs button{flex:1;height:34px;border:none;background:transparent;border-radius:9px;font-size:14px;color:#6B7280;font-weight:500;cursor:pointer;transition:.15s}
.tabs button.active{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(16,24,40,.08)}
.tagbar{padding:12px 0 0}
.tag-filter-chip{display:inline-flex;align-items:center;gap:7px;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px}
.tag-filter-chip button{border:none;background:rgba(61,123,250,.15);color:var(--accent);width:18px;height:18px;border-radius:50%;font-size:13px;line-height:1;cursor:pointer;padding:0}
main{flex:1;padding:12px 16px calc(120px + env(safe-area-inset-bottom))}
.group-header{display:flex;align-items:center;gap:8px;margin:18px 2px 8px}
.g-name{font-size:13px;font-weight:600;color:#6B7280}
.g-count{font-size:12px;color:#A9B0BA}
.g-more{margin-left:auto;width:28px;height:28px;border:none;background:transparent;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.g-more:active{background:#EEF0F4}
.done-label{font-size:12px;color:#A9B0BA;margin:14px 4px 8px}
.task{position:relative;display:flex;gap:12px;background:var(--card);border-radius:14px;padding:13px 14px 13px 16px;margin-bottom:8px;box-shadow:0 1px 2px rgba(16,24,40,.04);cursor:pointer;transition:transform .12s}
.task:active{transform:scale(.985)}
.task.anim{animation:tin .28s both}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
.pri-bar{position:absolute;left:0;top:12px;bottom:12px;width:4px;border-radius:0 3px 3px 0}
.check{width:23px;height:23px;border-radius:50%;border:2px solid #C7CBD3;background:transparent;flex:0 0 auto;margin-top:1px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;transition:background .2s,border-color .2s}
.check svg{width:12px;height:12px;stroke:#fff;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:22;stroke-dashoffset:22;transition:stroke-dashoffset .25s ease .05s}
.task.done .check{background:var(--accent);border-color:var(--accent);animation:pop .3s}
.task.done .check svg{stroke-dashoffset:0}
@keyframes pop{50%{transform:scale(1.15)}}
.t-body{flex:1;min-width:0}
.t-title{font-size:15.5px;font-weight:500;line-height:1.4;word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.task.done .t-title{color:#A9AFB9;text-decoration:line-through}
.task.done .t-meta{opacity:.65}
.t-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px;align-items:center}
.badge{display:inline-flex;align-items:center;padding:2.5px 9px;border-radius:999px;background:#F2F4F7;color:#6B7280;font-size:12px;line-height:1.5}
.badge.today{background:var(--accent-soft);color:var(--accent)}
.badge.overdue{background:#FEECEC;color:var(--danger)}
.tag-chip{display:inline-flex;align-items:center;border:none;cursor:pointer;padding:2.5px 9px;border-radius:999px;background:#F2F4F7;color:#6B7280;font-size:12px;line-height:1.5}
.tag-chip:active{background:#E7EAEF}
.empty{padding:70px 20px;text-align:center;color:#9AA1AB}
.empty svg{width:52px;height:52px;stroke:#C9CED6;fill:none;stroke-width:1.5}
.empty p{margin-top:12px;font-size:14px}
#fab{position:fixed;z-index:40;right:calc(50% - min(240px,50vw) + 18px);bottom:calc(22px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;border:none;background:var(--accent);color:#fff;box-shadow:0 8px 22px rgba(61,123,250,.45);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .15s}
#fab:active{transform:scale(.92)}
#overlay{position:fixed;inset:0;background:rgba(15,20,30,0);transition:background .28s;display:flex;align-items:flex-end;justify-content:center;z-index:60}
#overlay.show{background:rgba(15,20,30,.45)}
#sheet{width:100%;max-width:480px;background:#fff;border-radius:20px 20px 0 0;padding:10px 20px calc(18px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .3s cubic-bezier(.32,.72,.3,1);max-height:88vh;overflow:auto;border:none}
#sheet.open{transform:none}
.handle{width:36px;height:4px;border-radius:99px;background:#E3E6EB;margin:2px auto 10px}
.sheet-title{font-size:13px;color:#98A0A9;text-align:center;margin:0 0 12px;font-weight:500}
.input{width:100%;border:1.5px solid transparent;background:#F4F5F7;border-radius:12px;padding:11px 13px;font-size:16px;color:var(--ink);outline:none;font-family:inherit}
.input:focus{border-color:var(--accent);background:#fff}
#f-title{margin-top:2px}
.f-label{font-size:12px;font-weight:600;color:#98A0A9;margin:16px 0 8px;letter-spacing:.3px}
.chip-row{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;background:#F2F4F7;border:1.5px solid transparent;color:#4B5563;font-size:13.5px;cursor:pointer}
.chip.sel{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);font-weight:600}
.chip i{width:8px;height:8px;border-radius:50%;display:inline-block}
.chip .x{border:none;background:transparent;color:inherit;font-size:15px;padding:0 0 0 2px;cursor:pointer;line-height:1}
.due-row{display:flex;gap:8px}
.due-row input[type=date]{flex:1}
.due-row input[type=time]{width:112px}
.quick-row{display:flex;gap:8px;margin-top:8px}
.quick{border:none;background:#F2F4F7;color:#6B7280;font-size:12.5px;padding:5px 11px;border-radius:999px;cursor:pointer}
.quick:active{background:#E7EAEF}
.sheet-foot{display:flex;gap:10px;margin-top:20px}
.sheet-foot button{border:none;border-radius:12px;font-size:15.5px;font-weight:600;cursor:pointer;transition:transform .12s}
.sheet-foot button:active{transform:scale(.97)}
#btn-del{flex:0 0 auto;padding:13px 18px;background:#FEECEC;color:var(--danger)}
#btn-save{flex:1;padding:13px;background:var(--accent);color:#fff}
#auth-overlay{position:fixed;inset:0;background:rgba(15,20,30,0);transition:background .25s;display:flex;align-items:center;justify-content:center;z-index:65;padding:20px}
#auth-overlay.show{background:rgba(15,20,30,.45)}
.auth-card{width:min(320px,100%);background:#fff;border-radius:18px;padding:20px;transform:scale(.96);transition:transform .2s}
#auth-overlay.show .auth-card{transform:scale(1)}
.auth-tabs{display:flex;gap:2px;background:#E9EBF0;border-radius:10px;padding:3px;margin-bottom:14px}
.auth-tabs button{flex:1;height:30px;border:none;background:transparent;border-radius:8px;font-size:13.5px;color:#6B7280;cursor:pointer;font-family:inherit}
.auth-tabs button.active{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(16,24,40,.08)}
.auth-card .input{margin-bottom:10px}
.auth-err{font-size:12.5px;color:var(--danger);min-height:17px;margin:2px 0 8px}
.auth-submit{width:100%;padding:12px;border:none;border-radius:12px;background:var(--accent);color:#fff;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
.auth-submit:active{transform:scale(.97)}
.auth-submit:disabled{opacity:.6}
#fs-overlay{position:fixed;inset:0;background:rgba(15,20,30,0);transition:background .25s;display:flex;align-items:center;justify-content:center;z-index:65;padding:20px}
#fs-overlay.show{background:rgba(15,20,30,.45)}
#fs-overlay .auth-card{width:min(340px,100%)}
.fs-status{font-size:13px;color:#98A0A9;text-align:center;margin:0 0 12px;font-weight:500}
#fs-off{width:100%;padding:12px;border:none;border-radius:12px;background:#F2F4F7;color:#6B7280;font-size:15px;font-weight:600;cursor:pointer;margin-top:10px;font-family:inherit}
#fs-actions{margin-top:14px;padding-top:14px;border-top:1px dashed #E3E6EB}
#fs-toggle{width:100%;margin-top:14px;padding:9px 0 0;border:none;border-top:1px dashed #E3E6EB;background:transparent;color:var(--accent);font-size:13px;cursor:pointer;font-family:inherit}
#fs-setup{margin-top:6px}
.fs-btn-row{display:flex;gap:10px}
.fs-btn{flex:1;padding:12px 8px;border:none;border-radius:12px;background:var(--accent);color:#fff;font-size:14.5px;font-weight:600;cursor:pointer;font-family:inherit;transition:transform .12s}
.fs-btn:active{transform:scale(.97)}
.fs-btn.alt{background:var(--accent-soft);color:var(--accent)}
.fs-rules{font-size:12px;line-height:1.7;color:#8A9099;margin:12px 2px 0}
.fs-rules b{color:#6B7280}
#mini{position:fixed;inset:0;background:rgba(15,20,30,0);display:flex;align-items:center;justify-content:center;z-index:70;opacity:0;transition:opacity .2s;padding:20px}
#mini.show{opacity:1;background:rgba(15,20,30,.45)}
.mini-card{width:min(320px,100%);background:#fff;border-radius:18px;padding:20px;transform:scale(.96);transition:transform .2s}
#mini.show .mini-card{transform:scale(1)}
#mini-title{font-size:16px;font-weight:600;margin:0 0 12px}
#mini-msg{font-size:14px;color:#4B5563;line-height:1.5;margin:0 0 4px}
#mini-opts{display:flex;flex-direction:column;margin:4px -20px -8px}
.mini-opt{padding:13px 20px;text-align:left;border:none;background:none;font-size:15.5px;color:var(--ink);cursor:pointer;border-top:1px solid var(--line)}
.mini-opt.danger{color:var(--danger)}
.mini-actions{display:flex;gap:10px;margin-top:16px}
.mini-actions button{flex:1;padding:11px;border-radius:12px;border:none;font-size:15px;font-weight:600;cursor:pointer}
#btn-mini-cancel{background:#F2F4F7;color:#4B5563}
#btn-mini-ok{background:var(--accent);color:#fff}
#toast{position:fixed;left:50%;transform:translateX(-50%) translateY(-8px);top:calc(14px + env(safe-area-inset-top));bottom:auto;background:rgba(28,30,33,.92);color:#fff;padding:9px 16px;border-radius:999px;font-size:13.5px;opacity:0;transition:.25s;z-index:90;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="head-row">
      <div class="brand">轻记 · TODO</div>
      <div class="head-actions">
        <button type="button" class="sync-chip" id="menuChip" aria-label="数据管理"><svg viewBox="0 0 16 16" width="15" height="15"><circle cx="3" cy="8" r="1.6" fill="currentColor"/><circle cx="8" cy="8" r="1.6" fill="currentColor"/><circle cx="13" cy="8" r="1.6" fill="currentColor"/></svg></button>
        <button type="button" class="sync-chip auth" id="syncChip"><span class="dot"></span><span id="syncLabel">未启用</span></button>
      </div>
    </div>
    <h1 id="dateLine">—</h1>
    <nav class="tabs" id="tabs">
      <button data-tab="all" class="active">全部</button>
      <button data-tab="today">今天</button>
      <button data-tab="done">已完成</button>
    </nav>
    <div class="tagbar" id="tagbar" hidden></div>
  </header>
  <main id="list"></main>
  <button id="fab" aria-label="添加任务"><svg viewBox="0 0 24 24" width="24" height="24"><path d="M12 5v14M5 12h14" stroke="#fff" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg></button>

  <div id="overlay" hidden>
    <form id="sheet" novalidate>
      <div class="handle"></div>
      <div class="sheet-title" id="sheetTitle">新任务</div>
      <input id="f-title" class="input" type="text" placeholder="想做什么？" maxlength="200" autocomplete="off">
      <div class="f-label">分组</div>
      <div class="chip-row" id="f-groups"></div>
      <div class="f-label">截止时间</div>
      <div class="due-row">
        <input id="f-date" class="input" type="date">
        <input id="f-time" class="input" type="time">
      </div>
      <div class="quick-row">
        <button type="button" class="quick" data-quick="today">今天</button>
        <button type="button" class="quick" data-quick="tomorrow">明天</button>
        <button type="button" class="quick" data-quick="clear">清除</button>
      </div>
      <div class="f-label">优先级</div>
      <div class="chip-row" id="f-prios"></div>
      <div class="f-label">标签</div>
      <div class="chip-row" id="f-tags-view"></div>
      <input id="f-tag-input" class="input" type="text" placeholder="输入标签后回车添加" autocomplete="off" style="margin-top:8px">
      <div class="sheet-foot">
        <button type="button" id="btn-del" style="display:none">删除</button>
        <button type="submit" id="btn-save">保存</button>
      </div>
    </form>
  </div>

  <div id="fs-overlay" hidden>
    <div class="auth-card">
      <p class="fs-status" id="fs-status">飞书同步：未启用</p>
      <div id="fs-actions" hidden>
        <div class="fs-btn-row">
          <button type="button" class="fs-btn" id="fs-up">⬆ 上传到飞书</button>
          <button type="button" class="fs-btn" id="fs-down">⬇ 从飞书下载</button>
        </div>
        <p class="fs-rules"><b>规则</b>：改动 2 秒自动双向同步，<b>更新时间新的保留</b>（飞书里改也生效）；<b>上传</b>=以手机为准，<b>下载</b>=以飞书为准；删除双向传播。</p>
      </div>
      <button type="button" id="fs-toggle" class="fs-link">⚙ 连接设置 ▾</button>
      <div id="fs-setup">
        <input id="fs-base" class="input" type="text" placeholder="多维表格链接（my.feishu.cn/base/…）" autocomplete="off">
        <div id="fs-native">
          <div class="f-label" style="margin-top:16px">飞书应用凭据（只存本机）</div>
          <input id="fs-appid" class="input" type="text" placeholder="App ID（cli_ 开头）" autocomplete="off">
          <input id="fs-appsecret" class="input" type="password" placeholder="App Secret" autocomplete="off" style="margin-top:10px">
          <button type="button" class="auth-submit" id="fs-creds" style="background:var(--accent-soft);color:var(--accent);margin-top:10px">保存凭据</button>
          <button type="button" class="auth-submit" id="fs-auth" style="background:#3370FF;color:#fff;margin-top:10px">飞书授权登录（免 Secret）</button>
        </div>
        <div class="auth-err" id="fs-err"></div>
        <button type="button" class="auth-submit" id="fs-save">保存并启用</button>
        <button type="button" id="fs-off" hidden>停用飞书同步</button>
      </div>
    </div>
  </div>

  <div id="mini" hidden>
    <div class="mini-card">
      <div id="mini-title"></div>
      <p id="mini-msg" hidden></p>
      <div id="mini-opts" hidden></div>
      <div id="mini-form">
        <input id="mini-input" class="input" type="text" maxlength="30" autocomplete="off">
        <div class="mini-actions">
          <button type="button" id="btn-mini-cancel">取消</button>
          <button type="button" id="btn-mini-ok">确定</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" hidden></div>
  <input type="file" id="fileImport" accept=".json,application/json" hidden>
</div>
<script>
'use strict';
const LS_KEY='qingji.todo.v1';
const $=s=>document.querySelector(s);
const PRIORITY={high:{label:'高',color:'#FA5151',w:3},mid:{label:'中',color:'#FF9F0A',w:2},low:{label:'低',color:'#34C759',w:1}};
let state,tab='all',tagFilter=null,firstRender=true,editId=null,miniResolve=null,toastTimer=null,miniHideT=null;
let sel={groupId:null,priority:null,tags:[]};

function uid(){return (crypto.randomUUID?crypto.randomUUID():'id-'+Date.now()+'-'+Math.random().toString(36).slice(2,8))}
function pad(n){return n<10?'0'+n:''+n}
function ds(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function today(){return ds(new Date())}
function addDays(n){const d=new Date();d.setDate(d.getDate()+n);return ds(d)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function newTask(o){return Object.assign({id:uid(),title:'',done:false,groupId:null,due:null,priority:null,tags:[],createdAt:Date.now(),completedAt:null},o||{})}
function groupsSorted(){return state.groups.slice().sort((a,b)=>a.order-b.order)}
function taskById(id){return state.tasks.find(t=>t.id===id)}
function groupOf(t){return state.groups.find(g=>g.id===t.groupId)}

function seed(){
  return {groups:[],tasks:[],seedClean:true};
}
function load(){
  try{const raw=localStorage.getItem(LS_KEY);
    if(raw){const s=JSON.parse(raw);if(s&&Array.isArray(s.groups)&&Array.isArray(s.tasks))return s}
  }catch(e){}
  return seed();
}
function save(){try{state.seedClean=false;localStorage.setItem(LS_KEY,JSON.stringify(state))}catch(e){}}

function fmtDateLine(){const d=new Date();return (d.getMonth()+1)+'月'+d.getDate()+'日 星期'+'日一二三四五六'[d.getDay()]}
function dueInfo(t){
  if(!t.due||!t.due.date)return null;
  const td=today();let lab,cls='';
  if(t.due.date===td){lab='今天';cls='today'}
  else if(t.due.date===addDays(1))lab='明天';
  else if(t.due.date===addDays(-1)){lab='昨天';cls='overdue'}
  else{const p=t.due.date.split('-');lab=(+p[1])+'月'+(+p[2])+'日';if(t.due.date<td&&!t.done)cls='overdue'}
  if(t.due.time)lab+=' '+t.due.time;
  return {label:lab,cls};
}
function sortUndone(arr){
  const key=t=>((t.due&&t.due.date)?t.due.date:'9999-99-99')+' '+((t.due&&t.due.time)?t.due.time:'99:99');
  const w=t=>t.priority?PRIORITY[t.priority].w:0;
  return arr.sort((a,b)=>{
    const ka=key(a),kb=key(b);
    if(ka!==kb)return ka<kb?-1:1;
    if(w(a)!==w(b))return w(b)-w(a);
    return a.createdAt-b.createdAt;
  });
}
function buildSections(undone,doneExtra){
  const secs=[];
  const placed=new Set();
  for(const g of groupsSorted()){
    const items=undone.filter(t=>t.groupId===g.id);
    const dn=doneExtra.filter(t=>t.groupId===g.id);
    items.concat(dn).forEach(t=>placed.add(t.id));
    if(items.length||dn.length)secs.push({group:g,items,done:dn});
  }
  const orph=undone.filter(t=>!placed.has(t.id));
  const orphDone=doneExtra.filter(t=>!placed.has(t.id));
  if(orph.length||orphDone.length)secs.push({group:{id:null,name:'未分组'},items:orph,done:orphDone});
  return secs;
}
function visibleFor(tb){
  const td=today();
  const byTag=t=>!tagFilter||t.tags.includes(tagFilter);
  if(tb==='done'){
    return {flat:state.tasks.filter(t=>t.done).sort((a,b)=>(b.completedAt||0)-(a.completedAt||0))};
  }
  let undone=state.tasks.filter(t=>!t.done&&byTag(t));
  if(tb==='today')undone=undone.filter(t=>t.due&&t.due.date&&t.due.date<=td);
  sortUndone(undone);
  let doneExtra=[];
  if(tb==='all')doneExtra=state.tasks.filter(t=>t.done&&byTag(t));
  if(tb==='today')doneExtra=state.tasks.filter(t=>t.done&&t.completedAt&&ds(new Date(t.completedAt))===td&&byTag(t));
  return {sections:buildSections(undone,doneExtra)};
}
function taskHtml(t){

  const due=dueInfo(t);

  const meta=(gid||dueHtml||tagsHtml)?('<div class="t-meta">'+gid+dueHtml+tagsHtml+'</div>'):'';
  return '<div class="task '+(t.done?'done ':'')+(firstRender?'anim':'')+'" data-id="'+t.id+'">'+bar+

function emptyHtml(){

/* ---- 云同步（登录 / outbox / 推拉） ---- */
const AUTH_KEY='qingji.auth.v1';
const API_BASE=(()=>{const v=localStorage.getItem('qingji.api_base');if(v)return v.replace(/\/+$/,'');return (location.protocol==='http:'||location.protocol==='https:')?'':'http://127.0.0.1:8787';})();
const SYNC={token:null,user:null,cursor:0,offset:0,outbox:[],inFlight:false,timer:null,authMode:'login'};

function loadAuth(){
  try{const raw=localStorage.getItem(AUTH_KEY);if(!raw)return;const a=JSON.parse(raw);
    SYNC.token=a.token||null;SYNC.user=a.user||null;SYNC.cursor=a.cursor||0;SYNC.offset=a.offset||0;SYNC.outbox=Array.isArray(a.outbox)?a.outbox:[];
  }catch(e){}
}
function saveAuth(){
  try{localStorage.setItem(AUTH_KEY,JSON.stringify({token:SYNC.token,user:SYNC.user,cursor:SYNC.cursor,offset:SYNC.offset,outbox:SYNC.outbox}))}catch(e){}
}
const nowMs=()=>Date.now()+SYNC.offset;
function touch(t){t.updatedAt=nowMs()}
function findEntity(type,id){return type==='task'?state.tasks.find(t=>t.id===id):state.groups.find(g=>g.id===id)}
function removeEntity(type,id){if(type==='task')state.tasks=state.tasks.filter(t=>t.id!==id);else state.groups=state.groups.filter(g=>g.id!==id)}

// 变更登记：只存实体引用，发送时取最新快照（多次修改自动合并为一次）；实体已不存在即删除墓碑
function markDirty(type,id){
  if(!fsOn())return;
  // 推任务时连带登记其所属分组，保证对端分组可读
  if(type==='task'){
    const t=taskById(id);
    if(t&&t.groupId&&!SYNC.outbox.some(c=>c.entityType==='group'&&c.id===t.groupId))SYNC.outbox.push({entityType:'group',id:t.groupId});
  }
  if(!SYNC.outbox.some(c=>c.entityType===type&&c.id===id))SYNC.outbox.push({entityType:type,id});
  saveAuth();refreshSyncChip();scheduleSync(2000);
}
function snapshot(c){
  const d=findEntity(c.entityType,c.id);
  if(!d)return{id:c.id,deleted:true,updatedAt:nowMs()};
  return Object.assign({},d,{deleted:false,updatedAt:d.updatedAt||nowMs()});
}

async function api(method,path,body){
  const headers={'Content-Type':'application/json'};
  if(SYNC.token)headers.Authorization='Bearer '+SYNC.token;
  const res=await fetch(API_BASE+path,{method,headers,body:body?JSON.stringify(body):undefined});
  let d=null;try{d=await res.json()}catch(e){}
  if(!res.ok){const e=new Error((d&&d.error)||('HTTP '+res.status));e.status=res.status;throw e}
  if(d&&typeof d.serverTime==='number')SYNC.offset=d.serverTime-Date.now();
  return d;
}

// 拉取应用守卫：仅接受 updatedAt 严格更新的版本；墓碑则移除本地
function applyChanges(changes){
  let changed=false;
  for(const ch of changes){
    const d=ch.data;
    if(!d||typeof d!=='object')continue;
    const local=findEntity(ch.entityType,d.id);
    if(local){
      if((d.updatedAt||0)>(local.updatedAt||0)){
        removeEntity(ch.entityType,d.id);
        if(!d.deleted)(ch.entityType==='task'?state.tasks:state.groups).push(Object.assign({},d));
        changed=true;
      }
    }else if(!d.deleted){
      (ch.entityType==='task'?state.tasks:state.groups).push(Object.assign({},d));
      changed=true;
    }
  }
  return changed;
}

function refreshSyncChip(){
  const chip=$('#syncChip');
  if(fsOn()){
    let cls='ok',txt='飞书同步';
    if(SYNC.outbox.length){cls='pending';txt='待同步'}
    chip.className='sync-chip '+cls;
    $('#syncLabel').textContent=txt;
  }else{
    chip.className='sync-chip auth';
    $('#syncLabel').textContent='未启用';
  }
}
function setChip(cls,txt){const chip=$('#syncChip');chip.className='sync-chip '+cls;$('#syncLabel').textContent=txt}

function doSync(){return fsSync();}
function scheduleSync(ms){clearTimeout(SYNC.timer);SYNC.timer=setTimeout(doSync,ms)}

/* ---- 导入 / 导出备份 ---- */
function backupPayload(){
  return JSON.stringify({app:'qingji-todo',version:1,exportedAt:new Date().toISOString(),groups:state.groups,tasks:state.tasks},null,2);
}
function downloadJson(name,json){
  const blob=new Blob([json],{type:'application/json;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=name;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),8000);
}
async function copyText(t){
  try{ if(navigator.clipboard&&navigator.clipboard.writeText){ await navigator.clipboard.writeText(t); return true } }catch(e){}
  try{
    const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();return ok;
  }catch(e){ return false }
}
async function exportData(){
  const json=backupPayload();
  const fname='轻记备份-'+today()+'.json';
  // Android 原生壳：走系统分享面板
  if(typeof NativeBridge!=='undefined'&&NativeBridge&&typeof NativeBridge.share==='function'){
    NativeBridge.share(fname,json);return;
  }
  // iOS 原生壳（file://）：走系统分享，失败退到剪贴板
  if(location.protocol==='file:'&&navigator.share){
    try{ await navigator.share({title:fname,text:json}); toast('已打开分享'); return }
    catch(e){ if(e&&e.name==='AbortError')return }
  }
  // 网页 / Pages：直接下载文件
  if(location.protocol!=='file:'){
    try{ downloadJson(fname,json); toast('备份已开始下载'); return }catch(e){}
  }
  const ok=await copyText(json);
  toast(ok?'备份内容已复制到剪贴板':'导出失败，请重试');
}
function parseBackup(text){
  let d;try{ d=JSON.parse(text) }catch(e){ throw new Error('不是有效的 JSON 文件') }
  if(!d||!Array.isArray(d.groups)||!Array.isArray(d.tasks))throw new Error('缺少 groups/tasks 字段');
  return d;
}
function upsertFromBackup(d){
  let ng=0,nt=0;
  for(const g of d.groups){
    if(!g||typeof g.id!=='string'||!g.id)continue;
    const rec=Object.assign({},g,{updatedAt:g.updatedAt||nowMs(),deleted:!!g.deleted});
    const local=state.groups.find(x=>x.id===rec.id);
    if(rec.deleted){ if(local){removeEntity('group',rec.id);ng++} continue }
    if(!local){state.groups.push(rec);ng++}
    else if(rec.updatedAt>local.updatedAt){Object.assign(local,rec);ng++}
  }
  for(const t of d.tasks){
    if(!t||typeof t.id!=='string'||!t.id)continue;
    const rec=Object.assign({},t,{updatedAt:t.updatedAt||nowMs(),deleted:!!t.deleted});
    const local=state.tasks.find(x=>x.id===rec.id);
    if(rec.deleted){ if(local){removeEntity('task',rec.id);nt++} continue }
    if(!local){state.tasks.push(rec);nt++}
    else if(rec.updatedAt>local.updatedAt){Object.assign(local,rec);nt++}
  }
  return {ng,nt};
}
function applyBackup(d,mode){
  if(mode==='replace'){state.groups=[];state.tasks=[]}
  const r=upsertFromBackup(d);
  if(!state.groups.length)state.groups.push({id:'g-inbox',name:'收件箱',order:0,createdAt:Date.now(),updatedAt:nowMs()});
  save();render();
  if(SYNC.token){
    for(const g of state.groups)markDirty('group',g.id);
    for(const t of state.tasks)markDirty('task',t.id);
    scheduleSync(1000);
  }
  return r;
}
function importFromText(text){
  let d;
  try{ d=parseBackup(text) }catch(e){ toast(e.message); return }
  miniMenu('导入方式（备份含任务 '+d.tasks.length+' 条、分组 '+d.groups.length+' 个）',[
    {key:'merge',label:'合并到当前数据（推荐）'},
    {key:'replace',label:'替换全部（清空现有数据）',danger:true}
  ]).then(mode=>{
    if(!mode)return;
    const proceed=async()=>{
      if(mode==='replace'){
        const ok=await miniConfirm('将清空当前全部数据并替换为备份内容，确定？');
        if(!ok)return;
      }
      const r=applyBackup(d,mode);
      toast('导入完成：分组 '+r.ng+' 项、任务 '+r.nt+' 项');
    };
    proceed();
  });
}
function handleImportFile(file){
  if(!file)return;
  const fr=new FileReader();
  fr.onload=()=>{importFromText(String(fr.result))};
  fr.onerror=()=>toast('读取文件失败');
  fr.readAsText(file,'utf-8');
}

/* ---- 飞书多维表格同步（经本地中继 → lark-cli） ---- */
const FS_KEY='qingji.feishu.v1';
let FS={on:false,base:'',tasks:'',groups:'',relay:''};
function loadFeishu(){try{const r=localStorage.getItem(FS_KEY);if(r)FS=Object.assign(FS,JSON.parse(r))}catch(e){}}
function saveFeishu(){try{localStorage.setItem(FS_KEY,JSON.stringify(FS))}catch(e){}}
const fsOn=()=>!!(FS.on&&FS.base&&FS.tasks&&FS.groups);
function fsRelay(){return FS.relay||API_BASE||'http://127.0.0.1:8787'}
async function fsCall(args){
  // 优先：App 原生直连（Java 内置引擎，凭据仅存手机本地）
  if(typeof NativeBridge!=='undefined'&&NativeBridge&&typeof NativeBridge.feishu==='function'){
    let d=null;try{d=JSON.parse(await NativeBridge.feishu(JSON.stringify({args})))}catch(e){}
    if(d&&d.ok)return d.data;
    if(d&&d.code==='NO_CREDS'){/* 未配置凭据 → 回落本机中继 */}
    else{const e=new Error((d&&d.error)||'原生同步失败');e.status=500;throw e}
  }
  const res=await fetch(fsRelay()+'/v1/feishu/call',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({args})});
  let d=null;try{d=await res.json()}catch(e){}
  if(!res.ok||!d||!d.ok){const e=new Error((d&&d.error)||('HTTP '+res.status));e.status=res.status;throw e}
  return d.data;
}
function rowToObj(row,fields){const o={};for(let i=0;i<fields.length;i++)o[fields[i]]=row[i];return o}
const PRIO={'高':'high','中':'mid','低':'low'},PRIO_R={high:'高',mid:'中',low:'低'};
function msToDate(ms){return ds(new Date(ms))}
function dateToMs(s){const p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2],12,0,0).getTime()}
function fsTaskFrom(o){
  const ms=Number(o['截止日期'])||null;
  return{id:o['任务ID'],groupId:o['分组ID']||null,title:o['标题']||'',
    due:ms?{date:msToDate(ms),time:o['截止时间']||null}:null,
    priority:Array.isArray(o['优先级'])&&o['优先级'].length?PRIO[o['优先级'][0]]:null,
    tags:Array.isArray(o['标签'])?o['标签'].slice():[],
    done:Array.isArray(o['状态'])&&o['状态'][0]==='已完成',
    createdAt:Number(o['创建时间'])||Date.now(),
    completedAt:Number(o['完成时间'])||null,
    updatedAt:Number(o['更新时间'])||0,deleted:!!o['已删除']};
}
function fsTaskTo(t){
  return{'标题':t.title||'','任务ID':t.id,'分组ID':t.groupId||'','状态':[t.done?'已完成':'未完成'],
    '截止日期':t.due&&t.due.date?dateToMs(t.due.date):null,'截止时间':t.due&&t.due.time?t.due.time:'',
    '优先级':t.priority?[PRIO_R[t.priority]]:[],'标签':t.tags||[],
    '创建时间':t.createdAt||nowMs(),'更新时间':t.updatedAt||nowMs(),
    '完成时间':t.completedAt||0,'已删除':!!t.deleted};
}
function fsGroupFrom(o){
  return{id:o['分组ID'],name:o['名称']||'',order:Number(o['排序'])||0,
    createdAt:Number(o['创建时间'])||0,updatedAt:Number(o['更新时间'])||0,deleted:!!o['已删除']};
}
function fsGroupTo(g){
  return{'名称':g.name||'','分组ID':g.id,'排序':g.order||0,
    '创建时间':g.createdAt||nowMs(),'更新时间':g.updatedAt||nowMs(),'已删除':!!g.deleted};
}
function fsEntityFields(type,ent,id){
  if(type==='task'){
    if(ent)return fsTaskTo(ent);
    return fsTaskTo({id,groupId:null,title:'',due:null,priority:null,tags:[],done:false,createdAt:nowMs(),updatedAt:nowMs(),completedAt:null,deleted:true});
  }
  if(ent)return fsGroupTo(ent);
  return fsGroupTo({id,name:'',order:0,createdAt:nowMs(),updatedAt:nowMs(),deleted:true});
}
async function fsList(tableId){
  const d=await fsCall(['+record-list','--base-token',FS.base,'--table-id',tableId,'--format','json','--limit','200']);
  const fields=d.fields||[],rids=d.record_id_list||[];
  if(d.has_more)toast('数据超过 200 条，仅同步前 200 条');
  return (d.data||[]).map((row,i)=>({obj:rowToObj(row,fields),rid:rids[i]}));
}
// 拉取两表 → 生成 changes（含 record_id 映射，供推送定位行）
async function fsPullAll(){
  const[tasksRows,groupsRows]=await Promise.all([fsList(FS.tasks),fsList(FS.groups)]);
  const changes=[];
  const tRid={},gRid={};
  groupsRows.forEach(r=>{
    changes.push({entityType:'group',data:fsGroupFrom(r.obj)});
    if(r.obj['分组ID'])gRid[r.obj['分组ID']]=r.rid;
  });
  tasksRows.forEach(r=>{
    changes.push({entityType:'task',data:fsTaskFrom(r.obj)});
    if(r.obj['任务ID'])tRid[r.obj['任务ID']]=r.rid;
  });
  return{changes,tRid,gRid};
}
async function fsSync(){
  if(SYNC.inFlight)return;
  SYNC.inFlight=true;setChip('syncing','同步中');
  try{
    // ① 下载：LWW 守卫合并（更新时间取 max(业务列, 飞书系统最后修改)，覆盖飞书端 UI 编辑）
    const pull1=await fsPullAll();
    let dirty=applyChanges(pull1.changes);
    // ② 上传：outbox 按行定位，有则整行覆盖、无则新建（墓碑即删除）
    const outbox=SYNC.outbox.slice();
    SYNC.outbox=[];saveAuth();
    for(let i=0;i<outbox.length;i++){
      const c=outbox[i];
      const isT=c.entityType==='task';
      const tbl=isT?FS.tasks:FS.groups;
      const rid=isT?pull1.tRid[c.id]:pull1.gRid[c.id];
      const fields=fsEntityFields(c.entityType,findEntity(c.entityType,c.id),c.id);
      const args=rid
        ?['+record-upsert','--base-token',FS.base,'--table-id',tbl,'--record-id',rid,'--json',JSON.stringify(fields)]
        :['+record-upsert','--base-token',FS.base,'--table-id',tbl,'--json',JSON.stringify(fields)];
      try{await fsCall(args)}
      catch(e){SYNC.outbox.push(...outbox.slice(i));saveAuth();throw e}
    }
    // ③ 上传后再拉一轮：收敛并发窗口，让其他设备的最新改动立即可见
    if(outbox.length){
      const pull2=await fsPullAll();
      if(applyChanges(pull2.changes))dirty=true;
    }
    if(dirty){save();render()}
    FS.lastSync=Date.now();saveFeishu();
    refreshSyncChip();
  }catch(e){
    const wasOk=$('#syncChip').className.indexOf('error')<0;
    setChip('error','同步失败');
    if(wasOk)toast('同步失败：'+(e&&e.message||'未知错误'));
    console.warn('feishu sync failed:',e&&e.message);
  }finally{SYNC.inFlight=false}
}

/* ---- 飞书同步设置面板 ---- */
async function openFs(){
  const native=typeof NativeBridge!=='undefined'&&NativeBridge&&typeof NativeBridge.feishuCredsInfo==='function';
  let mode;
  if(native){
    try{
      const info=JSON.parse(NativeBridge.feishuCredsInfo());
      window.__savedAppId=info.appIdFull||'';
      mode=info.saved?('App直连 '+info.appId):'App直连 · 未存凭据';
      try{const st=JSON.parse(NativeBridge.oauthStatus());if(st.mode==='user')mode+=' · 已授权';}catch(e){}
    }catch(e){mode='App直连'}
    $('#fs-appid').value=window.__savedAppId||'';
    $('#fs-auth').hidden=false;
  }else{
    $('#fs-auth').hidden=true;
    mode='PC中继 · 检查中…';
    try{
      const r=await fetch(fsRelay()+'/v1/feishu/creds');
      const d=await r.json();
      mode=(d&&d.saved)?('PC中继 '+d.appId):'PC中继 · 未存凭据';
    }catch(e){mode='PC中继'}
  }
  $('#fs-status').textContent=(fsOn()?'飞书同步 · 已启用':'飞书同步 · 未启用')+' · '+mode
    +(FS.lastSync?(' · '+new Date(FS.lastSync).toLocaleTimeString()+'同步'):'');
  $('#fs-actions').hidden=!fsOn();
  $('#fs-setup').hidden=fsOn();
  setToggleLabel();
  $('#fs-base').value=FS.base?('https://my.feishu.cn/base/'+FS.base):'';
  $('#fs-err').textContent='';
  $('#fs-off').hidden=!fsOn();
  const ov=$('#fs-overlay');ov.hidden=false;
  requestAnimationFrame(()=>ov.classList.add('show'));
}
function setToggleLabel(){
  $('#fs-toggle').textContent=$('#fs-setup').hidden?'⚙ 连接设置 ▾':'⚙ 连接设置 ▴';
}
function closeFs(){
  const ov=$('#fs-overlay');ov.classList.remove('show');
  setTimeout(()=>{ov.hidden=true},250);
}
async function saveFs(){
  const err=$('#fs-err');err.textContent='';
  const url=$('#fs-base').value.trim();
  let token='';
  const m=url.match(/\/(?:base|app)\/([A-Za-z0-9]+)/);
  if(m)token=m[1];else if(/^[A-Za-z0-9]{15,}$/.test(url))token=url;
  if(!token){err.textContent='请粘贴多维表格链接';return}
  const btn=$('#fs-save');btn.disabled=true;btn.textContent='连接中…';
  try{
    const d=await fsCall(['+table-list','--base-token',token]);
    const tabs=d.tables||[];
    const t=tabs.find(x=>x.name==='任务'),g=tabs.find(x=>x.name==='分组');
    if(!t||!g){err.textContent='未找到「任务」「分组」两张表';return}
    FS={on:true,base:token,tasks:t.id,groups:g.id,relay:FS.relay};
    saveFeishu();
    if(!state.seedClean){
      state.groups.forEach(x=>markDirty('group',x.id));
      state.tasks.forEach(x=>markDirty('task',x.id));
    }
    closeFs();refreshSyncChip();toast('飞书同步已启用');
    doSync();
  }catch(e){
    err.textContent=e.message||'连接失败，请检查凭据与链接';
  }
  btn.disabled=false;btn.textContent='保存并启用';
}
function offFs(){
  FS={on:false,base:'',tasks:'',groups:'',relay:FS.relay};
  saveFeishu();refreshSyncChip();closeFs();toast('已停用飞书同步');
}
// 手动上传：以手机为准——先合并云端（doSync 内置拉取），再把本地全量登记推送
async function fsUploadAll(){
  if(!fsOn()){toast('请先启用飞书同步');return}
  toast('开始上传…');
  if(SYNC.inFlight)return;
  const b=$('#fs-up'),label=b.textContent;
  b.disabled=true;b.textContent='上传中…';
  try{
    state.groups.forEach(g=>markDirty('group',g.id));
    state.tasks.forEach(t=>markDirty('task',t.id));
    await doSync();
    if(SYNC.outbox.length)toast('上传未完成，已排队自动重试');
    else toast('已上传到飞书');
  }catch(e){
    toast('上传失败：'+(e&&e.message||'未知错误'));
  }finally{
    b.disabled=false;b.textContent=label;
  }
}
// 手动下载：只拉取合并，不推送
async function fsDownload(){
  if(!fsOn()){toast('请先启用飞书同步');return}
  toast('开始下载…');
  if(SYNC.inFlight)return;
  const b=$('#fs-down'),label=b.textContent;
  b.disabled=true;b.textContent='下载中…';
  setChip('syncing','同步中');
  try{
    const pull=await fsPullAll();
    const dirty=applyChanges(pull.changes);
    if(dirty){save();render()}
    FS.lastSync=Date.now();saveFeishu();
    refreshSyncChip();
    toast(dirty?'已从飞书下载合并':'飞书已是最新');
  }catch(e){
    setChip('error','同步失败');
    toast('下载失败：'+(e&&e.message||'未知错误'));
  }finally{
    b.disabled=false;b.textContent=label;
  }
}
$('#fs-overlay').addEventListener('click',e=>{if(e.target.id==='fs-overlay')closeFs()});
$('#fs-save').addEventListener('click',saveFs);
$('#fs-off').addEventListener('click',offFs);
$('#fs-toggle').addEventListener('click',()=>{
  const s=$('#fs-setup');
  s.hidden=!s.hidden;
  setToggleLabel();
});
// 事件委托：无论绑定时机/顺序如何，上传/下载点击必达
document.addEventListener('click',e=>{
  if(!e.target||!e.target.closest)return;
  if(e.target.closest('#fs-up')){fsUploadAll();return;}
  if(e.target.closest('#fs-down')){fsDownload();return;}
});
$('#fs-creds').addEventListener('click',async()=>{
  const id=$('#fs-appid').value.trim(),sec=$('#fs-appsecret').value.trim();
  if(!id||!id.startsWith('cli_')||!sec){$('#fs-err').textContent='App ID 需为 cli_ 开头，且 Secret 不能为空';return}
  const btn=$('#fs-creds'),label=btn.textContent;
  btn.disabled=true;btn.textContent='保存中…';
  try{
    const native=typeof NativeBridge!=='undefined'&&NativeBridge&&typeof NativeBridge.feishuCreds==='function';
    let saved=false;
    if(native){
      saved=NativeBridge.feishuCreds(id,sec)==='ok';
    }else{
      const r=await fetch(fsRelay()+'/v1/feishu/creds',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({app_id:id,app_secret:sec})});
      saved=!!r.ok;
    }
    if(saved){$('#fs-appsecret').value='';toast('凭据已保存在本机');openFs();}
    else{$('#fs-err').textContent='保存失败，请检查凭据'}
  }catch(e){
    $('#fs-err').textContent='保存失败：'+(e&&e.message||'');
  }
  btn.disabled=false;btn.textContent=label;
});

/* ---- 飞书授权登录（App 内，免 Secret；手动填 Secret 保留为并行路径） ---- */
const OAUTH_REDIRECT='https://439436269-ctrl.github.io/qingji-todo-web/oauth.html';
const OAUTH_SCOPES='bitable:app:readonly bitable:app base:record:retrieve base:record:read base:record:write';
function startFeishuAuth(){
  const appId=($('#fs-appid').value.trim())||window.__savedAppId||'';
  if(!appId||!appId.startsWith('cli_')){$('#fs-err').textContent='请先填入 App ID（授权只需 App ID，无需 Secret）';return}
  if(typeof NativeBridge==='undefined'||!NativeBridge.openUrl){$('#fs-err').textContent='仅 App 内支持授权登录';return}
  const url='https://accounts.feishu.cn/open-apis/authen/v1/authorize?client_id='+appId
    +'&redirect_uri='+encodeURIComponent(OAUTH_REDIRECT)
    +'&response_type=code&state=qingji'
    +'&scope='+encodeURIComponent(OAUTH_SCOPES);
  NativeBridge.openUrl(url);
}
window.__feishuOAuth=function(code){
  try{
    const r=JSON.parse(NativeBridge.oauthExchange(code));
    if(!r.ok){toast('授权失败：'+(r.error||'未知错误'));return}
    toast('飞书授权成功');
    if(!FS.on){openFs();}else{doSync();}
  }catch(e){toast('授权失败：'+(e&&e.message||''))}
};
$('#fs-auth').addEventListener('click',startFeishuAuth);

state=load();
loadAuth();
loadFeishu();
render();
refreshSyncChip();
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&fsOn())scheduleSync(1000)});
setInterval(()=>{if(fsOn())doSync()},300000);

if((location.protocol==='https:'||location.protocol==='http:')&&'serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
